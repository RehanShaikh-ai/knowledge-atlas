# Alembic configuration for Collaborative Second Brain backend

[alembic]
# Path to migration scripts (relative to this file)
script_location = %(here)s/alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path path, prepended to sys.path if present
prepend_sys_path = .

# Version location specification
version_locations = %(here)s/alembic/versions

# Output encoding
output_encoding = utf-8

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
